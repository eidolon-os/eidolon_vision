[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eidolon-vision"
version = "0.1.0"
description = "Eidolon Vision Worker — host visual cortex; distills gated image bursts into sense.* facts"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "eidolon" }]
keywords = ["vision", "companion", "mediapipe", "fatigue", "sense"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

# Runtime dependencies. Group ordering follows architecture layers
# (transport -> auth -> contracts -> vision -> vlm -> observability).
dependencies = [
    # Transport
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",   # /v1/burst and /v1/look are multipart uploads
    "httpx>=0.27.0",
    # Auth: verify Hub-signed scoped upload tokens (same primitive as voice tokens)
    "PyJWT[crypto]>=2.8.0",
    # Contracts: sense.* facts live in the SDK (single source of truth)
    "eidolon-sdk",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "PyYAML>=6.0.1",
    # Frame decode — needed by every adapter that touches pixels.
    "opencv-python-headless>=4.9.0",
    "numpy>=1.26.0",
    # Observability
    "loguru>=0.7.2",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
# Heavy model deps follow their adapter, not the service. Installing only the
# adapters a host actually binds keeps a Pi from carrying an unused framework.
perceptor-mediapipe = ["mediapipe>=0.10.14"]
interpreter-ocr = ["rapidocr-onnxruntime>1.3.24", "onnxruntime>=1.17"]
interpreter-cloud = ["litellm>=1.40.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.uv.sources]
eidolon-sdk = { path = "../eidolon_sdk", editable = true }

[tool.setuptools.packages.find]
include = ["eidolon_vision*"]

[tool.pytest.ini_options]
testpaths = ["tests", "eidolon_vision/capabilities"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# Demo driver is executed directly, not imported.
"scripts/*.py" = ["EXE001"]
# Form()/File() in parameter defaults is FastAPI's documented idiom.
"eidolon_vision/app/http.py" = ["B008"]
"eidolon_vision/app/faces_http.py" = ["B008"]
# Optional-adapter construction must degrade on *any* failure — a missing extra,
# a missing model asset, or a runtime's own init error. Narrowing defeats that.
"eidolon_vision/app/bootstrap.py" = ["BLE001"]
