# eidolon_vision default settings, as documentation. Nothing loads this file:
# Settings reads the environment (EIDOLON_VISION_*) and its own defaults, so the
# values here are a readable copy of those defaults and not the ones in effect.
# Change eidolon_vision/app/config.py with them.
# Secrets (hub_public_key) are injected at deploy — never commit them here.

host: 127.0.0.1
# Registered as vision.api in the workspace port registry. 8085 is Data's
# workspace API on every Host; 18xxx is where that registry keeps projects that
# are not product units.
port: 18085

hub_base_url: http://127.0.0.1:8080
hub_public_key: ""        # PEM, injected at deploy

face_model_path: models/face_landmarker.task   # download at provision time; git-ignored

vlm_model: gpt-4o-mini    # ⑥ look — concrete model is a product/cost choice
